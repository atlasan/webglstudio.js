<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />

<title>WebGLStudio Player</title>
	<style type='text/css'>
		html, body {
			width: 100%;
			height: 100%;
			margin: 0;
			padding: 0;
		}
	</style>

<meta property="og:title" content="WebGLStudio Player" />
<meta property="og:description" content="Edit 3D on the web" />
<meta property="og:image" content="" />

<link rel="icon" type="image/png" href="favicon.ico">

</head>
<body>

<!-- core libraries -->
<script type="text/javascript" src="js/extra/gl-matrix-min.js"></script>
<script type="text/javascript" src="js/extra/litegl.js"></script>
<script type="text/javascript" src="js/extra/litegraph.js"></script>
<script type="text/javascript" src="js/extra/litescene.js"></script>
<script type="text/javascript" src="js/extra/Canvas2DtoWebGL.js"></script>

<script type="text/javascript">

	//LiteSCENE CODE *************************
	var settings = {
		alpha: false, //enables to have alpha in the canvas to blend with background
		stencil: true,
		redraw: true, //force to redraw
		autoplay: Boolean(LS.queryString["autoplay"]),
		resources: "fileserver/files/",
		autoresize: true, //resize the 3D window if the browser window is resized
		loadingbar: true, //shows loading bar progress
		proxy: "@/proxy.php?url=" //allows to proxy request to avoid cross domain problems, in this case the @ means same domain, so it will be http://hostname/proxy
	};
	/*SETTINGS_SETUP*/

	var player = new LS.Player(settings);

	//SCENE URL POLICY *************************
	//a scene can contain scripts that run with the privileges of this page (same origin as the editor,
	//which keeps the file server session token in localStorage), so only scenes from trusted origins are loaded:
	//this same origin, plus the external file server configured by the user in the editor (Drive preferences)
	var trusted_scene_origins = [ location.origin ];

	//support for external server
	try
	{
		var data = localStorage.getItem("wgl_user_preferences" );
		var config = data ? JSON.parse(data) : null;
		var files_url = config && config.modules && config.modules.Drive && config.modules.Drive.fileserver_files_url;
		if( files_url )
		{
			LS.ResourcesManager.setPath( files_url );
			trusted_scene_origins.push( new URL( files_url, location.href ).origin );
		}
	}
	catch (err)
	{
		console.warn("Player: cannot read user preferences", err );
	}

	//returns true if the scene url points to http(s) in one of the trusted origins
	//(resolving it like the browser does, so "//other.host/x.json" or "data:..." are not considered local)
	function isTrustedSceneURL( url )
	{
		if( typeof(url) != "string" || !url )
			return false;
		var resolved = null;
		try
		{
			resolved = new URL( url, location.href );
		}
		catch (err)
		{
			return false;
		}
		if( resolved.protocol != "http:" && resolved.protocol != "https:" )
			return false;
		return trusted_scene_origins.indexOf( resolved.origin ) != -1;
	}

	function showPlayerMessage( text )
	{
		var div = document.createElement("div");
		div.style.cssText = "position:fixed;left:0;right:0;top:40%;text-align:center;color:#ddd;font:16px sans-serif;padding:0 16px;";
		div.textContent = text; //textContent: never interpret the url as html
		document.body.appendChild( div );
	}

	//allow to use Canvas2D call in the WebGLCanvas (this is not mandatory, just useful)
	if( window.enableWebGLCanvas )
		enableWebGLCanvas( gl.canvas );

	if( LS.queryString["debug"] )
		player.enableDebug();

	//this code defines which scene to load, in case you are loading an specific scene replce it by player.loadScene( scene_url )
	var scene_url = LS.queryString["url"];
	if( LS.queryString["session"] )
		player.setScene( JSON.parse( localStorage.getItem( LS.queryString["session"] ) ) );
	else if( scene_url && isTrustedSceneURL( scene_url ) )
		player.loadScene( scene_url ); //the url must be something like: fileserver/files/guest/projects/Lee_FX.json
	else if( scene_url )
	{
		console.error("Player: scene url blocked, it is not from a trusted origin:", scene_url );
		showPlayerMessage( "This scene cannot be loaded: it is not hosted on this server or on your configured file server. Scenes can run code, so only trusted sources are allowed: " + scene_url );
	}
	else if( LS.queryString["preview"] === undefined )
		player.loadConfig("config.json");

</script>

</body>
</html>
